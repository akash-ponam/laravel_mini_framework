<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <link href="/css/add_product.css" rel="stylesheet">
    </head>
    <body>

        <form id="add_form">



            <h1>Add New Product</h1>



            <input type="number" name="product_id" placeholder="product id " required>


            <input type="text" name="name" placeholder="product name" required id="product_name" >
            

            <input type="text" name="slug" placeholder="product slug" required id="product_slug">

            
            <select id="brand" name="brand" required>

                <option >ESports</option>
                <option > L-Kidas </option>
                <option >E-wears</option>
                <option>Tesla</option>

            </select>


             <select id="category" name="category">

                <option> Outerwear </option>
                <option> Footwear</option>
                <option> Essentials</option>
                <option> Cars </option>
                <option>Kitchen</option>
                <option> Room</option>
                <option> Electronics</option>


             </select>


            <textarea id="specs" class="specs" name="specs" rows="9" placeholder='{"colors": ["red", "blue"], "sizes": ["M", "L"]}'> 
            </textarea>


            <button id="openDialogBtn"class="add_features">ADD FEATURES </button>



            
            <p id="json_error" style="color: red; display: none;">INVALID JSON FORMAT</p>
            

            <input type="file" name="product_image" accept="image/*" id="product_image_id"  >

            <input type="number" name="product_price" required>

            <button type="submit" id="btn_add_product">ADD PRODUCT</button>
          
        </form>


    <dialog id="specsDialog" style="border: 1px solid #ccc; border-radius: 8px; padding: 20px; width: 400px;">
    <h3>Add Product Specifications</h3>
    
    <!-- Container where key/value rows will be added dynamically -->
    <div id="pairsContainer">
        <!-- Rows look like: [Key Input] : [Value Input] [Delete Button] -->
    </div>

    <br>
    <button type="button" id="addPairBtn">+ Add New Row</button>
    <hr>
    <button type="button" id="saveSpecsBtn">Save & Apply</button>
    <button type="button" id="closeDialogBtn">Cancel</button>
</dialog>



    
    



    <script type="text/javascript" src="/js/add_product.js?v=1.5">
        
    </script>
    </body>
</html>
