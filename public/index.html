<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <link href="/css/index.css" rel="stylesheet">
    </head>
    <body>

    <div class="container">


        <div class="card" id="main_card">


                    <div id="register_view">

                        <h2 id="title">Create Account</h2>

                        <form id="reg_form">

                            <input type="email" name="email" placeholder="potato@gmail.com" required>
                            <input type="password" name="password" placeholder="password here" required>

                            
                            <div class="file_wrapper">

                                <label for="avatar" > Upload Profile Picture</label>
                                
                                <input type="file" id="avatar" name="profile_url" accept="image/*" >
                            
                            </div>


                            <button id="submit_button" type="submit"> 

                                
                                <span id="btn_text">Register</span>

                                <div  class="spinner" id="btn_spinner" style="display: none;"   > </div>


                            </button>



                        </form>
                        

                            <button style="margin-top: 1rem;" id="reg_to_login"> 


                        <span id="btn_text"> Already member ? Login here</span>



                    </button>



                    </div>


                    <div id="login_view" style="display: none;">

                        <h2 id="title">Login</h2>

                        <form id="login_form">

                            <input type="email" name="email" placeholder="potato@gmail.com" required>
                            <input type="password" name="password" placeholder="password here" required>

                            


                            <button id="login_submit_button" type="submit"> 

                                
                                <span id="login_btn_text">Login</span>

                                <div  class="spinner" id="login_btn_spinner" style="display: none;"   > </div>


                            </button>



                        </form>


                          <button style="margin-top: 1rem;" id="login_to_reg"> 


                        <span id="btn_text"> New User ? Register Here </span>



                    </button>
                        





                    </div>




            






                    <div id="profile_view" style="display: none;" >


                        <div class="success_icon">
                            ✓
                        </div>

                        <img src="" alt="" id="usr_img">

                        <h2 id="user_email"></h2>
                        
                        <p>Welcome to platform</p>









                    </div>
                        
            



            




            
        </div>  



    </div>


<script  type="text/javascript"   src="/js/index.js?v=1.2"></script>

    
    </body>
</html>
