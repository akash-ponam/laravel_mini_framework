<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <link href="/css/products.css" rel="stylesheet">
    </head>
    <body>

        <header class="products-header">




              <div class="cart_icon_wrapper">

                
                  <img src="/uploads/cart.png" alt="cart" >

                  <p class="quantity">0</p>


                
              </div>  

                <div class="profile_card" >  </div>

            
            <div class="profile_options_menu"> 


                <p id="user_info" class="profile_options_menu_item"></p>


                <button id="user_logout_btn" class="profile_options_menu_item">Logout</button>




            </div>

            

                
            

        </header>


        <div class="filter_sort_wrapper"> 


            <div class="sort_wrapper"> 


                <img src="uploads/sort.png"  class="sort_icon">


                <div class="sort_chip" id="price_asc">

                    <p> price Low to high</p>

                </div>


                <div class="sort_chip" id="price_desc">


                    <p> price high to low</p>



                </div>


            </div>

            
                
            <div class="per_page_wrapper">

                <label for="">Records</label>
                <input type="number" value="10" class="per_page_input" min="10"></input>


                
            </div>






            <div class="pagination_wrapper">
                
            </div>
                



        </div>


       

        <div class="product-grid" id="product-grid">
            
        </div>

        


    <script type="text/javascript" src="/js/products.js?v=7.0"></script> 
    </body>
</html>
